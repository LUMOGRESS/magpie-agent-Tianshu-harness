<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-label="Dual-Module Sync Architecture for Tianshu 4.1.54+">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#111d38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17274a"/>
      <stop offset="100%" stop-color="#111e3b"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14203b"/>
      <stop offset="100%" stop-color="#0f182e"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="952" height="440" rx="18" fill="url(#bg)" stroke="#23365c" stroke-width="1.5"/>
  <rect x="4" y="4" width="952" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>

  <!-- Header -->
  <text x="32" y="42" class="t" font-size="18" font-weight="700" fill="#f1f5f9">双模块实时桥接架构</text>
  <text x="208" y="42" class="t" font-size="13" font-weight="500" fill="#94a3b8">Dual-Module Sync Architecture · Tianshu 4.1.54+</text>
  <rect x="784" y="22" width="144" height="26" rx="13" fill="#172c54" stroke="#3b63a8" stroke-width="1"/>
  <text x="856" y="39" text-anchor="middle" class="t" font-size="11.5" font-weight="600" fill="#93c5fd">零外部依赖 · 原子可逆</text>

  <!-- Column 1: Magpie Side -->
  <text x="32" y="80" class="t" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="0.6">01 · MAGPIE 入口层</text>

  <rect x="32" y="92" width="224" height="84" rx="12" fill="url(#cardDark)" stroke="#2c4470" stroke-width="1.2"/>
  <text x="48" y="118" class="t" font-size="14" font-weight="700" fill="#f8fafc">Magpie Agents / CLI</text>
  <text x="48" y="139" class="t" font-size="11.5" fill="#cbd5e1">在 Agents 页直接点选模型</text>
  <rect x="48" y="148" width="176" height="20" rx="5" fill="#0b1326" stroke="#243a63" stroke-width="1"/>
  <text x="56" y="162" class="mono" font-size="10.5" fill="#7dd3fc">magpie tianshu &lt;model&gt;</text>

  <line x1="144" y1="176" x2="144" y2="212" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <rect x="32" y="218" width="224" height="132" rx="12" fill="url(#cardBlue)" stroke="#3b69b5" stroke-width="1.4"/>
  <rect x="48" y="232" width="96" height="20" rx="10" fill="#1d4ed8" opacity="0.35" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="96" y="246" text-anchor="middle" class="t" font-size="10.5" font-weight="600" fill="#bfdbfe">moejs 纯沙盒</text>
  <text x="48" y="274" class="mono" font-size="13.5" font-weight="700" fill="#f8fafc">tianshu.agent.js</text>
  <text x="48" y="295" class="t" font-size="11.5" fill="#cbd5e1">• 保留 Agents 模型选择器</text>
  <text x="48" y="314" class="t" font-size="11.5" fill="#cbd5e1">• 传递网关地址与模型元数据</text>
  <text x="48" y="333" class="t" font-size="11.5" fill="#cbd5e1">• 输出干净连接意图 JSON</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <path d="M 256 284 L 284 284 L 284 134 L 310 134" fill="none" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Column 2: Control & Companion Bridge -->
  <text x="318" y="80" class="t" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.6">02 · 控制文件与伴生桥接</text>

  <rect x="318" y="92" width="276" height="84" rx="12" fill="url(#cardDark)" stroke="#355285" stroke-width="1.2"/>
  <text x="334" y="117" class="t" font-size="13.5" font-weight="700" fill="#f8fafc">控制意图文件</text>
  <text x="334" y="137" class="mono" font-size="10.8" fill="#93c5fd">~/.config/magpie-tianshu/connection.json</text>
  <text x="334" y="159" class="t" font-size="11.2" fill="#94a3b8">记录 gatewayKey · 全量目录 · 选中模型 · 能力参数</text>

  <line x1="456" y1="176" x2="456" y2="212" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="466" y="184" width="122" height="20" rx="6" fill="#0d1b36" stroke="#294473" stroke-width="1"/>
  <text x="527" y="198" text-anchor="middle" class="mono" font-size="10" fill="#7dd3fc">fs.watch + 750ms</text>

  <rect x="318" y="218" width="276" height="132" rx="12" fill="url(#cardBlue)" stroke="#4f7fff" stroke-width="1.5"/>
  <rect x="334" y="232" width="128" height="20" rx="10" fill="#2563eb" opacity="0.35" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="398" y="246" text-anchor="middle" class="t" font-size="10.5" font-weight="600" fill="#bfdbfe">Magpie Bun 伴生宿主</text>
  <text x="334" y="274" class="mono" font-size="13.5" font-weight="700" fill="#f8fafc">index.mjs + bridge.mjs</text>

  <!-- Feature Pills inside Bridge -->
  <rect x="334" y="286" width="118" height="24" rx="6" fill="#0d1830" stroke="#2b4578" stroke-width="1"/>
  <text x="393" y="302" text-anchor="middle" class="t" font-size="10.8" fill="#cbd5e1">跨进程锁 + 断电日志</text>
  <rect x="460" y="286" width="120" height="24" rx="6" fill="#0d1830" stroke="#2b4578" stroke-width="1"/>
  <text x="520" y="302" text-anchor="middle" class="t" font-size="10.8" fill="#cbd5e1">自动注入私网白名单</text>

  <rect x="334" y="316" width="118" height="24" rx="6" fill="#0d1830" stroke="#2b4578" stroke-width="1"/>
  <text x="393" y="332" text-anchor="middle" class="t" font-size="10.8" fill="#cbd5e1">同步 provider-keys</text>
  <rect x="460" y="316" width="120" height="24" rx="6" fill="#0d1830" stroke="#2b4578" stroke-width="1"/>
  <text x="520" y="332" text-anchor="middle" class="t" font-size="10.8" fill="#cbd5e1">断开一键无损还原</text>

  <!-- Branching Arrows Col 2 -> Col 3 -->
  <path d="M 594 284 L 624 284 L 624 130 L 650 130" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
  <path d="M 594 284 L 650 222" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
  <path d="M 594 284 L 624 284 L 624 312 L 650 312" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#arrowBlue)"/>

  <!-- Column 3: Tianshu 4.1.54+ Targets -->
  <text x="658" y="80" class="t" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.6">03 · 天枢 4.1.54+ 自动发现多数据根</text>

  <!-- Target 1 -->
  <rect x="658" y="92" width="270" height="76" rx="12" fill="url(#cardDark)" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="674" y="116" class="t" font-size="13" font-weight="700" fill="#f8fafc">Windows 桌面端便携模式</text>
  <text x="674" y="136" class="mono" font-size="10.5" fill="#7dd3fc">&lt;安装目录&gt;\TianshuData\.rivet</text>
  <text x="674" y="155" class="t" font-size="11" fill="#94a3b8">同步 config.json + 清理旧 provider-keys.json</text>

  <!-- Target 2 -->
  <rect x="658" y="182" width="270" height="76" rx="12" fill="url(#cardDark)" stroke="#355285" stroke-width="1.2"/>
  <text x="674" y="206" class="t" font-size="13" font-weight="700" fill="#f8fafc">自定义路径 / launcher.json</text>
  <text x="674" y="226" class="mono" font-size="10.5" fill="#93c5fd">MAGPIE_TIANSHU_* / RIVET_HOME</text>
  <text x="674" y="245" class="t" font-size="11" fill="#94a3b8">支持桌面端自定义存储目录与环境变量覆盖</text>

  <!-- Target 3 -->
  <rect x="658" y="272" width="270" height="78" rx="12" fill="url(#cardDark)" stroke="#355285" stroke-width="1.2"/>
  <text x="674" y="296" class="t" font-size="13" font-weight="700" fill="#f8fafc">CLI 平台默认数据根</text>
  <text x="674" y="316" class="mono" font-size="10.5" fill="#a5b4fc">%LOCALAPPDATA%\.rivet  |  ~/.rivet</text>
  <text x="674" y="336" class="t" font-size="11" fill="#94a3b8">严格对齐 4.1.54 平台路径（非 Windows ~/.rivet）</text>

  <!-- Bottom Convergence Banner -->
  <rect x="32" y="376" width="896" height="44" rx="10" fill="#0f203d" stroke="#28467a" stroke-width="1"/>
  <circle cx="56" cy="398" r="6" fill="#34d399"/>
  <text x="72" y="403" class="t" font-size="12.5" font-weight="600" fill="#e2e8f0">4.1.54 热加载与迁移收敛：</text>
  <text x="234" y="403" class="t" font-size="12" fill="#94a3b8">天枢加载时将 apiKey 迁移到 secrets.json (keyRef) 并重建 provider-keys.json，桥接识别后保持 up_to_date，零重写循环。</text>
</svg>
